# pytest configuration.
#
# testpaths  - where to look, so plain `pytest` works from the project root
# pythonpath - puts src/ on the import path (pytest 7+). conftest.py also
#              does this, belt and braces, because a broken import path is a
#              confusing failure for a beginner to debug.
# addopts    - flags applied to every run:
#                -q                quiet
#                --strict-markers  a typo'd @pytest.mark is an error, not a
#                                  silently ignored decorator
#                --tb=short        short tracebacks; the long ones bury the
#                                  assertion that actually failed
[pytest]
testpaths = tests
pythonpath = src
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
